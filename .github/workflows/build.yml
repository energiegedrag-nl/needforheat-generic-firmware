name: Build CI
# Trigger on any change that is not markdown and not in the main branch.
on:
  push:
    branches: [ main, release/v3 ]
    paths-ignore:
      - '**.md'
  # Build every PR, whatever its base branch (also stacked PRs).
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 8 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # List all of the PlatformIO platforms to build
        platformio_env:
          - ESP32DEV
          - M5STACK_COREINK

        # List of the examples to build.
        test_dir:
          - test/generic-test
        
    steps:
      # Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v7


      # Setup Python (needed by PlatformIO)
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Setup PlatformIO.
      - name: Setup PlatformIO
        run: pip install platformio
      
      # Build the PlatformIO project.
      - name: Build PlatformIO project
        env:
          PLATFORMIO_ENV: ${{ matrix.platformio_env }}
          TEST_DIR: ${{ matrix.test_dir }}
        run: pio run -e $PLATFORMIO_ENV -d $TEST_DIR

  # Unit tests that run on the PC (no device needed), e.g. the power-loss tests of the flash log.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: FlashLog power-loss tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I include test/host/flash_log_test.cpp -o flash_log_test
          ./flash_log_test
