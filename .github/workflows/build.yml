name: Build CI
# Trigger on any change that is not markdown and not in the main branch.
on:
  push:
    branches: [ main, release/v3 ]
    paths-ignore:
      - '**.md'
  # Build every PR, whatever its base branch (also stacked PRs).
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 8 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Finish every build, also when one fails: both sizes and linker maps are useful.
      fail-fast: false
      matrix:
        # List all of the PlatformIO platforms to build
        platformio_env:
          - ESP32DEV
          - M5STACK_COREINK

        # List of the examples to build.
        test_dir:
          - test/generic-test
        
    steps:
      # Checkout repository.
      - name: Checkout repository
        uses: actions/checkout@v7


      # Setup Python (needed by PlatformIO)
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Setup PlatformIO.
      - name: Setup PlatformIO
        run: pip install platformio
      
      # Build the PlatformIO project.
      - name: Build PlatformIO project
        env:
          PLATFORMIO_ENV: ${{ matrix.platformio_env }}
          TEST_DIR: ${{ matrix.test_dir }}
        run: pio run -e $PLATFORMIO_ENV -d $TEST_DIR

      # The linker map shows what takes the flash (the CoreInk app partition is nearly full).
      - name: Upload the linker map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-map-${{ matrix.platformio_env }}
          # ESP-IDF writes it next to firmware.elf; the .pio folder is hidden.
          path: ${{ matrix.test_dir }}/.pio/build/${{ matrix.platformio_env }}/firmware.map
          include-hidden-files: true
          if-no-files-found: ignore

  # Unit tests that run on the PC (no device needed), e.g. the power-loss tests of the flash log.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: FlashLog power-loss tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I include test/host/flash_log_test.cpp -o flash_log_test
          ./flash_log_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I include test/host/provisioning_code_test.cpp -o provisioning_code_test
          ./provisioning_code_test

  # Draws every e-ink screen on the PC (LovyanGFX, 1-bit) and keeps the images as a build artifact, to check the
  # layout at 1:1 and x3 before flashing; see test/host-render/README.md.
  screen-renders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Render the screens
        run: |
          sh test/host-render/build.sh build/screens
          pip install pillow
          python test/host-render/to_png.py build/screens
      - name: Upload the screens
        uses: actions/upload-artifact@v4
        with:
          name: eink-screens
          path: build/screens/*.png
