name: Create draft release
# The generic firmware is a library: device repositories use it through lib_deps with a tag, and they publish
# the firmware binaries. A tag here therefore gets a check (host tests and a build of the test project) and a
# draft release with release notes, without binaries and without signing (no secure boot; see TODO #480).
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platformio_env: [ESP32DEV, M5STACK_COREINK]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Setup PlatformIO
        run: pip install platformio

      - name: Build test project
        env:
          PLATFORMIO_ENV: ${{ matrix.platformio_env }}
        run: pio run -e $PLATFORMIO_ENV -d test/generic-test

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Host tests
        run: |
          for t in test/host/*_test.cpp; do
            [ -e "$t" ] || continue
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -I include "$t" -o "${t%.cpp}"
            "./${t%.cpp}"
          done

  draft-release:
    needs: [build, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
